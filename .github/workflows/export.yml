# opencgs-image
name: Export OpenCGS

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Pull OpenCGS
        run: |
          docker pull --platform linux/amd64 nemocrys/opencgs:v1.0.1

      - name: Save image
        run: |
          docker save nemocrys/opencgs:v1.0.1 | gzip -1 > opencgs_v1.0.1.tar.gz
          ls -lh opencgs_v1.0.1.tar.gz
          sha256sum opencgs_v1.0.1.tar.gz > SHA256.txt
          cat SHA256.txt

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: opencgs-v1.0.1-image
          path: |
            opencgs_v1.0.1.tar.gz
            SHA256.txt
          compression-level: 0




          
