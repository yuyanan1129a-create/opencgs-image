# opencgs-image
name: Export OpenCGS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Pull OpenCGS
        run: |
          docker pull --platform linux/amd64 nemocrys/opencgs:v1.0.1

      - name: Save image
        run: |
          docker save nemocrys/opencgs:v1.0.1 \
            | gzip -1 \
            > opencgs_v1.0.1.tar.gz

          sha256sum opencgs_v1.0.1.tar.gz > SHA256.txt

          ls -lh opencgs_v1.0.1.tar.gz
          cat SHA256.txt

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete opencgs-v1.0.1-export \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag -y || true

          gh release create opencgs-v1.0.1-export \
            opencgs_v1.0.1.tar.gz \
            SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenCGS v1.0.1 image" \
            --notes "Official nemocrys/opencgs:v1.0.1 linux/amd64 image"
